# Весь проект одной командой: docker compose up --build
# Сайт: http://localhost   API: http://localhost/api   Документация API: http://localhost/api/docs
services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 3s
      retries: 10

volumes:
  pgdata:
